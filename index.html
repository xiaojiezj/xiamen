<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2c53d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>厦门 Color Walk · 阳光黄组</title>
<style>
:root{--y:#f2c53d;--y2:#fff3c4;--y3:#e0a800;--ink:#3b2f0b;--sub:#8a7a4a;--red:#c0392b;--blue:#1d4ed8;--bg:#fbf6e6;--line:#efe4c2;--tab:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;background:#e9e2cc;color:var(--ink);line-height:1.55;font-size:15px}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 12px)}
a{color:inherit;text-decoration:none}

/* 顶部 */
.hero{background:var(--y);padding:calc(18px + env(safe-area-inset-top)) 18px 16px}
.hero h1{margin:0;font-size:22px}
.hero .s{font-size:13px;color:#5b4a12;margin-top:2px}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;background:rgba(255,255,255,.6);border-radius:999px;padding:3px 10px}

/* 分段控件 */
.seg{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--line)}
.seg .in{display:flex;background:#efe6c8;border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;font-size:14px;font-weight:700;color:var(--sub);padding:8px 0;border-radius:10px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.pane{display:none;padding:14px}
.pane.on{display:block}

/* 通用 */
.note{border-radius:14px;padding:11px 13px;font-size:14px;margin-bottom:12px}
.note.y{background:var(--y2)}
.note.r{background:#fdecea;color:#7a1f16}
.h{font-size:17px;font-weight:800;margin:18px 2px 10px;display:flex;align-items:center;gap:6px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:12px;overflow:hidden}
.pad{padding:13px 14px}

/* 地图 */
.map img{width:100%;display:block}
.map .cap{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px}
.map .cap b{font-size:15px}
.map .cap span{color:var(--sub)}
.zoom{font-size:12px;font-weight:700;background:var(--y2);border-radius:999px;padding:4px 10px;white-space:nowrap}

/* 路段 */
.leg{display:flex;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.leg:last-child{border-bottom:0}
.leg .ic{flex:0 0 38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;background:#fff1d6}
.leg .ic.car{background:#e3eeff}
.leg .t{font-weight:800;font-size:15px}
.leg .d{font-size:13px;color:var(--sub);margin:1px 0 4px}
.leg .r{font-size:14px}
.leg .r b{background:var(--y2);border-radius:4px;padding:0 3px;font-weight:700}

/* 时间轴 */
.tl{position:relative;padding:4px 0 4px 0}
.tl .it{display:flex;gap:12px;position:relative;padding-bottom:14px}
.tl .it:before{content:"";position:absolute;left:47px;top:22px;bottom:-2px;width:2px;background:#e8d9a6}
.tl .it:last-child:before{display:none}
.tl .tm{flex:0 0 40px;font-size:12px;font-weight:800;color:var(--red);text-align:right;padding-top:2px;line-height:1.25}
.tl .dot{flex:0 0 12px;height:12px;border-radius:50%;background:var(--y3);margin-top:5px;border:2px solid #fff;box-shadow:0 0 0 2px var(--y3);z-index:1}
.tl .dot.mv{background:#fff}
.tl .bd{flex:1;min-width:0;background:#fff;border-radius:12px;padding:9px 12px;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.tl .bd b{display:block;font-size:14px}
.tl .bd span{font-size:13px;color:var(--sub)}
.tl .bd.mv{background:transparent;box-shadow:none;padding:4px 2px}

/* 拍照点 */
.chips2{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.chips2::-webkit-scrollbar{display:none}
.chips2 a{flex:0 0 auto;font-size:13px;font-weight:700;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.spot .top{display:flex;gap:10px;align-items:center;padding:13px 14px 8px}
.no{flex:0 0 34px;height:34px;border-radius:50%;background:var(--y3);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.no.sub{background:#d65a3c}
.spot h3{margin:0;font-size:16px}
.spot .when{font-size:12px;color:var(--red);font-weight:700}
.sw{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 14px 4px;scrollbar-width:none}
.sw::-webkit-scrollbar{display:none}
.sw figure{flex:0 0 72%;margin:0;scroll-snap-align:start;position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/5;background:#eee}
.sw figure.one{flex-basis:100%}
.sw img{width:100%;height:100%;object-fit:cover;display:block}
.sw figcaption{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff}
.sw figcaption.ai{background:rgba(107,33,168,.85)}
.cnt{font-size:11px;color:var(--sub);padding:4px 14px 0}
.info{padding:8px 14px 4px;font-size:14px}
.info .row{display:flex;gap:8px;margin:4px 0}
.info .k{flex:0 0 48px;color:var(--sub);font-size:13px}
.info .v{flex:1;min-width:0}
.how{margin:8px 14px;background:#fffbea;border-radius:12px;padding:9px 12px;font-size:14px}
.how ol{margin:4px 0 0;padding-left:18px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:6px 14px 14px}
.acts a{text-align:center;font-size:13px;font-weight:700;border-radius:12px;padding:10px 0;background:var(--y2)}
.acts a.b{background:#e3eeff;color:var(--blue)}
.acts a.x{background:#ffe4e1;color:var(--red)}

/* 任务 */
.task .pad b{font-size:15px}
.task .pad p{margin:4px 0 0;font-size:14px}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:6px;background:var(--y3);color:#fff}
.badge.o{background:#9bb07a}
.mem{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.mem:last-child{border-bottom:0}
.mem span{color:var(--sub);font-size:13px;text-align:right}
.chk label{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--y3)}

/* 底部 Tab */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:0;background:none;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#a59870;font-weight:700}
.tabbar button i{font-style:normal;font-size:21px;filter:grayscale(1);opacity:.6}
.tabbar button.on{color:var(--ink)}
.tabbar button.on i{filter:none;opacity:1}
.view{display:none}.view.on{display:block}

/* 大图查看 */
#lb{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
#lb.on{display:flex}
#lb .bar{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;font-size:13px}
#lb .bar button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;padding:6px 14px;font-size:14px}
#lb .sc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center;justify-content:center}
#lb .sc img{max-width:100%;max-height:100%;object-fit:contain}
#lb.big .sc{display:block}
#lb.big .sc img{max-width:none;max-height:none;width:250%}
#lb .tip{color:#aaa;font-size:12px;text-align:center;padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
footer{font-size:11px;color:var(--sub);text-align:center;padding:16px 18px 4px}
</style>
</head>

function planHTML(id){
  const p=P[id];
  let h=`<div class="seg"><div class="in"><button class="on" data-p="route">🗺 路线</button><button data-p="time">⏰ 时间</button><button data-p="spot">📷 拍照点</button></div></div>`;
  // 路线
  h+=`<div class="pane on" data-p="route"><div class="note y">${p.theme}</div><div class="note r">${p.warn}</div>`;
  p.maps.forEach(([f,t,d])=>h+=`<div class="card map" data-img="assets/maps/${f}.jpg" data-t="${t}"><img loading="lazy" src="assets/maps/${f}.jpg" alt="${t}"><div class="cap"><div><b>${t}</b> <span>${d}</span></div><span class="zoom">🔍 查看大图</span></div></div>`);
  h+=`<div class="h">🚶 每段怎么走</div><div class="card">`;
  p.legs.forEach(([ic,t,d,r])=>h+=`<div class="leg"><div class="ic ${ic==='🚕'?'car':''}">${ic}</div><div><div class="t">${t}</div><div class="d">${d}</div><div class="r">${r}</div></div></div>`);
  h+=`</div></div>`;
  // 时间
  h+=`<div class="pane" data-p="time"><div class="tl">`;
  p.tl.forEach(([tm,t,s,mv])=>h+=`<div class="it"><div class="tm">${tm}</div><div class="dot ${mv?'mv':''}"></div><div class="bd ${mv?'mv':''}"><b>${t}</b>${s?`<span>${s}</span>`:''}</div></div>`);
  h+=`</div></div>`;
  // 拍照点
  h+=`<div class="pane" data-p="spot"><div class="chips2">`;
  p.spots.forEach(([no,k])=>h+=`<a href="#${id}-${k}">${no} ${SP[k].n}</a>`);
  h+=`</div>`;
  p.spots.forEach(([no,k,w])=>{
    const s=SP[k],pics=[...(s.ai||[]).map(a=>[C+a+'.jpg','AI 构图示意',1]),...s.imgs.map(i=>[A+i+'.jpg','高德实拍',0])];
    h+=`<div class="card spot" id="${id}-${k}"><div class="top"><div class="no ${/^[a-e]$/.test(no)?'sub':''}">${({'①':1,'②':2,'③':3,'④':4,'⑤':5})[no]||no}</div><div><h3>${s.n}</h3><div class="when">${w}</div></div></div>
    <div class="sw">${pics.map(([src,c,ai])=>`<figure class="${pics.length===1?'one':''}" data-img="${src}" data-t="${s.n} · ${c}"><img loading="lazy" src="${src}"><figcaption class="${ai?'ai':''}">${c}</figcaption></figure>`).join('')}</div>
    ${pics.length>1?`<div class="cnt">← 左右滑动看 ${pics.length} 张参考图</div>`:''}
    <div class="info"><div class="row"><div class="k">位置</div><div class="v">${s.addr}</div></div><div class="row"><div class="k">高德搜</div><div class="v"><b>${s.poi}</b></div></div><div class="row"><div class="k">拍什么</div><div class="v">${s.what}</div></div></div>
    <div class="how"><b>📷 机位 & 拍法</b><ol>${s.how.map(x=>`<li>${x}</li>`).join('')}</ol></div>
    <div class="acts"><a href="${amap(s.poi,s.g,s.t)}">📍 定位</a><a class="b" href="${nav(s.poi,s.g,s.t)}">🧭 导航</a><a class="x" href="${xhs(s.q)}">📕 小红书</a></div></div>`;
  });
  return h+`</div>`;
}
